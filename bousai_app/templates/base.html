<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>{% block title %}防災アプリ{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --brand-blue-900: #0c4c7c;
      --brand-blue-700: #0e5d95;
      --brand-blue-500: #1b7ec9;
      --ink-900: #1a2b3a;
      --ink-700: #425466;
      --surface: #edf2f5;
      --panel: #f6f7f8;
      --white: #ffffff;
      --shadow: rgba(12, 76, 124, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Noto Sans JP", "Yu Gothic", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Segoe UI", sans-serif;
      background: var(--surface);
      color: var(--ink-900);
    }

    .site-header {
      background: linear-gradient(180deg, var(--brand-blue-700) 0%, var(--brand-blue-900) 100%);
      color: var(--white);
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.05);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 64px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      color: var(--white);
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .brand-name {
      font-size: clamp(1.7rem, 2vw, 2.2rem);
      line-height: 1;
    }

    .menu-button {
      width: 42px;
      height: 42px;
      border: 0;
      background: transparent;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
    }

    .menu-button span,
    .menu-button span::before,
    .menu-button span::after {
      display: block;
      width: 26px;
      height: 3px;
      background: var(--white);
      border-radius: 2px;
      position: relative;
      content: "";
    }

    .menu-button span::before {
      position: absolute;
      top: -8px;
      left: 0;
    }

    .menu-button span::after {
      position: absolute;
      top: 8px;
      left: 0;
    }

    .user-status {
      display: none;
    }

    .nav-wrap {
      display: none;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 28px 20px 40px;
    }

    @media (max-width: 640px) {
      .header-inner {
        padding-left: 18px;
        padding-right: 18px;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="/" class="brand" aria-label="防災アプリ ホームへ">
        <span class="brand-name">防災アプリ</span>
      </a>

      <button class="menu-button" aria-label="メニューを開く">
        <span></span>
      </button>
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
