<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>{% block title %}防災アプリ{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --brand-blue-900: #0c4c7c;
      --brand-blue-700: #0e5d95;
      --brand-blue-500: #1b7ec9;
      --ink-900: #1a2b3a;
      --ink-700: #425466;
      --surface: #edf2f5;
      --panel: #f6f7f8;
      --white: #ffffff;
      --shadow: rgba(12, 76, 124, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Noto Sans JP", "Yu Gothic", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Segoe UI", sans-serif;
      background: var(--surface);
      color: var(--ink-900);
    }

    .site-header {
      background: linear-gradient(180deg, var(--brand-blue-700) 0%, var(--brand-blue-900) 100%);
      color: var(--white);
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.05);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 64px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      color: var(--white);
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .brand-name {
      font-size: clamp(1.7rem, 2vw, 2.2rem);
      line-height: 1;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .user-status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.9);
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.16);
      font-weight: 700;
    }

    .user-status a,
    .nav-links a {
      color: var(--white);
      text-decoration: none;
      transition: opacity 0.2s ease;
    }

    .user-status a:hover,
    .nav-links a:hover {
      opacity: 0.8;
    }

    .nav-wrap {
      background: rgba(255,255,255,0.04);
      border-top: 1px solid rgba(255,255,255,0.08);
    }

    .nav-links {
      max-width: 1100px;
      margin: 0 auto;
      padding: 12px 24px 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px 18px;
      flex-wrap: wrap;
      font-weight: 600;
      font-size: 0.96rem;
    }

    .nav-links a {
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .nav-separator {
      color: rgba(255,255,255,0.6);
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 28px 20px 40px;
    }

    @media (max-width: 640px) {
      .header-inner {
        padding-left: 18px;
        padding-right: 18px;
        align-items: flex-start;
      }

      .header-actions {
        width: 100%;
        justify-content: flex-start;
      }

      .nav-links {
        justify-content: flex-start;
        padding-left: 18px;
        padding-right: 18px;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="/" class="brand" aria-label="防災アプリ ホームへ">
        <span class="brand-name">防災アプリ</span>
      </a>

      <div class="header-actions">
        <div class="user-status">
          {% if session.logged_in %}
            <span class="status-pill">ログイン中{% if session.username %}（{{ session.username }}）{% endif %}</span>
            <a href="/logout">ログアウト</a>
          {% else %}
            <span class="status-pill">未ログイン</span>
            <a href="/login">ログイン</a>
          {% endif %}
        </div>
      </div>
    </div>

    <div class="nav-wrap">
      <nav class="nav-links" aria-label="メインナビゲーション">
        <a href="/">ホーム</a>
        <span class="nav-separator">|</span>
        <a href="/shelter_search">避難所検索</a>
        <span class="nav-separator">|</span>
        <a href="/shelter_register">避難所登録</a>
        <span class="nav-separator">|</span>
        <a href="/board">指示・発信ボード</a>
      </nav>
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
