{% extends "base.html" %}

{% block content %}
<style>
  .home-shell {
    max-width: 930px;
    margin: 0 auto;
    display: grid;
    gap: 18px;
  }

  .panel {
    background: rgba(255,255,255,0.82);
    border: 1px solid rgba(18, 57, 95, 0.08);
    border-radius: 16px;
    box-shadow: 0 8px 18px rgba(15, 76, 124, 0.06);
    padding: 18px 18px 14px;
  }

  .map-title {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0 0 14px;
    font-size: clamp(1.3rem, 2vw, 1.8rem);
    color: #0e3d66;
    font-weight: 700;
  }

  .map-icon {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #1c7fd7;
    position: relative;
    box-shadow: 0 0 0 4px rgba(28, 127, 215, 0.12);
  }

  .map-icon::after {
    content: "";
    position: absolute;
    width: 8px;
    height: 8px;
    background: #fff;
    border-radius: 50%;
    left: 5px;
    top: 5px;
  }

  .map-wrap {
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid rgba(18,57,95,0.08);
    background: #dfeef8;
  }

  #shelterMap {
    height: 330px;
    width: 100%;
  }

  .weather-panel {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }

  .weather-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: clamp(1.3rem, 2vw, 1.8rem);
    color: #0e3d66;
    font-weight: 700;
    margin: 0;
  }

  .weather-icon {
    font-size: 1.25rem;
  }

  .auto-update {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: #0d9d4f;
    font-weight: 700;
    font-size: 0.95rem;
  }

  .auto-update .sync {
    width: 16px;
    height: 16px;
    border: 2px solid #25b364;
    border-left-color: transparent;
    border-radius: 50%;
    transform: rotate(30deg);
    display: inline-block;
    position: relative;
  }

  .auto-update .sync::before {
    content: "";
    position: absolute;
    top: -6px;
    right: -2px;
    border-left: 5px solid transparent;
    border-right: 5px solid transparent;
    border-bottom: 8px solid #25b364;
    transform: rotate(30deg);
  }

  #weatherContent {
    background: #f7fafb;
    border: 1px solid rgba(18, 57, 95, 0.08);
    border-radius: 12px;
    padding: 16px 18px;
    color: #294b6d;
    min-height: 145px;
  }

  #weatherContent p,
  #weatherContent li {
    line-height: 1.8;
    margin: 0 0 8px;
  }

  #weatherContent ul {
    margin: 10px 0 14px 1.2rem;
    padding-left: 0;
  }

  #weatherContent .area-name {
    font-size: 1.05rem;
    font-weight: 700;
    color: #0f3d66;
  }

  .status-ok {
    color: #1c9d65;
    font-weight: 700;
  }

  .status-ok::before {
    content: "✓ ";
  }

  .status-time {
    color: #58718a;
  }

  @media (max-width: 640px) {
    .weather-panel {
      align-items: flex-start;
    }

    #shelterMap {
      height: 260px;
    }
  }
</style>

<div class="home-shell">
  <section class="panel">
    <h2 class="map-title"><span class="map-icon"></span>避難所マップ</h2>
    <div class="map-wrap">
      <div id="shelterMap"></div>
    </div>
  </section>

  <section class="panel">
    <div class="weather-panel">
      <h2 class="weather-title"><span class="weather-icon">☁</span>藤沢市 気象警報・注意報</h2>
      <div class="auto-update"><span class="sync"></span>10分おき自動更新</div>
    </div>

    <div id="weatherContent">
      <p>読み込み中...</p>
    </div>
  </section>
</div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const map = L.map('shelterMap').setView([35.3390, 139.4903], 12);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    function updateWeatherWarnings() {
        fetch('/api/weather_warnings')
            .then(response => response.json())
            .then(data => {
                console.log('気象情報を更新しました:', data);
                updateWeatherContent(data);
            })
            .catch(error => {
                console.error('気象情報の更新に失敗しました:', error);
            });
    }

    function updateWeatherContent(data) {
        const weatherContent = document.getElementById('weatherContent');

        if (data.error) {
            weatherContent.innerHTML = '<p>気象情報の取得に失敗しました</p>';
            return;
        }

        let warningsHtml = '';
        if (data.warnings && data.warnings.length > 0) {
            warningsHtml = '<ul>';
            data.warnings.forEach(warning => {
                warningsHtml += `<li>${warning.name}（${warning.status}）</li>`;
            });
            warningsHtml += '</ul>';
        } else {
            warningsHtml = '<p class="status-ok">現在、警報・注意報は発表されていません</p>';
        }

        weatherContent.innerHTML = `
            <p class="area-name">${data.area_name || '青森市'}</p>
            ${warningsHtml}
            <p class="status-time">最終確認: ${data.last_fetch_time || '更新中...'}</p>
            <p class="status-time">気象庁最終発表: ${data.report_time || '不明'}</p>
        `;
    }

    updateWeatherWarnings();
    setInterval(updateWeatherWarnings, 600000);
});
</script>
{% endblock %}
